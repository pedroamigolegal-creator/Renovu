<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile - Renovu</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/renovu-icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="users" class="bg-profile">
<div id="shell"></div>
<main class="page" id="profile">
  <div class="profile-card">
    <div class="profile-top">
      <span class="avatar-circle"><img id="p-avatar" src="/assets/noob/noob-head.png" alt=""></span>
      <div>
        <h1 id="p-name"></h1>
        <div class="handle" id="p-handle"></div>
        <div class="stats">
          <div class="stat">Friends<b id="p-friends-n">0</b></div>
          <div class="stat">Followers<b>0</b></div>
          <div class="stat">Following<b>0</b></div>
          <div class="stat">RAP<b>0</b></div>
        </div>
      </div>
    </div>
  </div>
  <div class="ptabs"><button class="active" data-tab="about">About</button><button data-tab="creations">Creations</button></div>
  <div id="tab-about">
    <h3 class="pbar">About</h3>
    <div class="pbar-wrap">
      <div class="about-text" id="about-text"><span id="p-about"></span></div>
      <div class="about-edit" id="about-edit" hidden>
        <textarea id="about-ta" maxlength="1000" aria-label="About"></textarea>
        <div class="row"><button class="btn-blue" id="about-save" type="button">Save</button><button class="link-btn" id="about-cancel" type="button">Cancel</button><span id="about-err" style="color:#c00;font-size:13px"></span></div>
      </div>
      <div class="about-foot"><button class="link-btn" id="about-edit-btn" type="button" hidden>Edit</button><a href="#">Report Abuse</a></div>
    </div>
    <h3 class="pbar" style="margin-top:14px">Currently Wearing</h3>
    <div class="viewer" id="p-viewer"><img id="p-wear-img" src="/assets/noob/noob-full.png" alt="Avatar"><button class="btn-3d" id="p-3d" type="button">3D</button></div>
    <h3 class="pbar" id="p-friends-title" style="margin-top:14px">Friends (0)</h3>
    <div class="white-box"><div class="friends-row" id="p-friends"></div></div>
  </div>
  <div id="tab-creations" hidden>
    <h3 class="pbar">Creations</h3>
    <div class="white-box"><div class="muted">Nothing created yet.</div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/noob3d.js"></script>
<script src="/assets/js/app.js"></script>
</body>
</html>
